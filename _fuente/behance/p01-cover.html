<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>Renueva Smart — Behance cover</title>
<link rel="stylesheet" href="../renueva-fonts.css">
<link rel="stylesheet" href="_behance-base.css">
<style>
.cover{height:1080px;background:var(--ink)}
.cover img.bg{filter:grayscale(1) brightness(.5) contrast(1.16)}
.ct{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:4;
    text-align:center}
.ct img.logo{width:900px}
.ct .sub{margin-top:34px;font-family:var(--f-body);font-weight:700;font-size:16px;

</style></head><body>

<div class="panel dark cover" id="panel">
  <img class="bg" src="../fotos_hi/px-30699851.jpg" style="object-position:50% 42%">
  <div class="veil-cover"></div>

  <div class="ct">
    <img class="logo" src="../assets/logo-sobre-oscuro.png">
    <div class="sub">Sistema de contenido para Instagram</div>
  </div>

  <div class="pie" style="color:rgba(255,255,255,.55)">
    <span class="firma" style="color:#fff">TU NOMBRE — Diseño y dirección de arte</span>
    <span>2026</span>
  </div>
</div>

</body></html>
