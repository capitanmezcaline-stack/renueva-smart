<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>Renueva Smart — Behance cover</title>
<link rel="stylesheet" href="../renueva-fonts.css">
<link rel="stylesheet" href="_behance-base.css">
<style>
.cover{height:1080px;background:var(--ink)}
.cover img{filter:grayscale(1) brightness(.62) contrast(1.14)}
.ct{position:absolute;left:var(--safe);right:var(--safe);top:50%;transform:translateY(-52%);
    z-index:4}
.ct .eyebrow{color:#fff;opacity:.7;margin-bottom:26px}
.ct h1{font-size:150px;color:#fff}
.ct .sub{margin-top:30px;font-family:var(--f-body);font-size:27px;line-height:1.5;
         color:rgba(255,255,255,.82);max-width:820px}
.top{position:absolute;left:var(--safe);right:var(--safe);top:64px;z-index:4;
     display:flex;justify-content:space-between;align-items:center}
.top .marca{font-family:var(--f-display);font-weight:700;font-size:22px;color:#fff}
.top .marca em{font-style:italic;color:var(--orange)}
.top .tags{display:flex;gap:14px;font-family:var(--f-body);font-weight:700;font-size:12px;
           letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.top .tags span{padding:9px 16px;border:1px solid rgba(255,255,255,.28);border-radius:20px}
</style></head><body>

<div class="panel dark cover" id="panel">
  <img class="bg" src="../fotos_hi/px-30699851.jpg" style="object-position:50% 42%">
  <div class="veil-cover"></div>

  <div class="top">
    <div class="marca">Renueva <em>Smart</em></div>
    <div class="tags"><span>Branding</span><span>Social media</span><span>Dirección de arte</span></div>
  </div>

  <div class="ct">
    <div class="eyebrow">Case study</div>
    <h1 class="tt">Un sistema de<br>contenido<span class="it" style="color:var(--orange)">,</span> desde cero.</h1>
    <div class="sub">Identidad visual, arquitectura de perfil y 60+ piezas para
      @renuevasmart — una agencia de rediseño web que necesitaba, primero
      que nada, rediseñar la suya.</div>
  </div>

  <div class="pie" style="color:rgba(255,255,255,.6)">
    <span class="firma" style="color:#fff">Tu Nombre — Diseñador/a</span>
    <span>2026</span>
  </div>
</div>

</body></html>
