<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>Renueva Smart — Behance feed</title>
<link rel="stylesheet" href="../renueva-fonts.css">
<link rel="stylesheet" href="_behance-base.css">
<style>
.fd{padding:150px var(--safe) 140px;display:flex;gap:110px;align-items:center}
.fd .txt{flex:0 0 620px}
.fd h2{font-size:74px}
.fd .sub{margin-top:26px;font-family:var(--f-body);font-size:22px;line-height:1.6;
        color:var(--body);max-width:560px}
.fd .regla{margin-top:52px;display:flex;flex-direction:column;gap:0}
.fd .regla div{display:flex;gap:22px;padding:22px 0;border-top:1px solid var(--line)}
.fd .regla div:last-child{border-bottom:1px solid var(--line)}
.fd .regla .ico{flex:0 0 34px;height:34px;border-radius:50%;margin-top:2px}
.fd .regla p{font-family:var(--f-body);font-weight:700;font-size:19px;color:var(--ink)}

.telefono{flex:1;display:flex;justify-content:center}
.marco{width:420px;border-radius:34px;overflow:hidden;box-shadow:0 50px 110px rgba(11,12,14,.22);
       background:#fff;border:1px solid #E7E6E2}
.marco .cab{height:64px;background:#fff;border-bottom:1px solid #ECECE8;display:flex;
           align-items:center;padding:0 26px;gap:14px}
.marco .cab img{height:28px}
.marco .cab span{font-family:var(--f-body);font-weight:700;font-size:15px}
.marco img.grid{width:100%;display:block}
</style></head><body>

<div class="panel white" id="panel">
  <div class="fd">
    <div class="txt">
      <div class="eyebrow">Arquitectura de perfil</div>
      <h2 class="tt" style="margin-top:26px">Un feed que no<br>se repite.</h2>

      <div class="regla">
        <div><div class="ico" style="background:var(--ink)"></div>
          <p>4 materiales, nunca dos iguales seguidos</p></div>
        <div><div class="ico" style="background:var(--orange)"></div>
          <p>Sin diagonales ni filas espejadas</p></div>
        <div><div class="ico" style="background:#fff;border:1px solid var(--line)"></div>
          <p>Ninguna foto se repite</p></div>
      </div>
    </div>

    <div class="telefono">
      <div class="marco">
        <div class="cab"><img src="../assets/logo-dark.png"><span>renuevasmart</span></div>
        <img class="grid" src="_feed-crop.jpg">
      </div>
    </div>
  </div>
  <div class="pie">
    <span class="firma">Renueva Smart — Sistema de contenido</span>
    <span class="num">05 / 08</span>
  </div>
</div>

</body></html>
