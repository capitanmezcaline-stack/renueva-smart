<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>Renueva Smart — Behance contexto</title>
<link rel="stylesheet" href="../renueva-fonts.css">
<link rel="stylesheet" href="_behance-base.css">
<style>
.ctx{padding:170px var(--safe) 150px}
.ctx .eyebrow{margin-bottom:28px}
.ctx h2{font-size:88px;max-width:1200px}
.ctx .sub{margin-top:26px;font-family:var(--f-body);font-size:22px;color:var(--grey)}

.numeros{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
         border:1px solid var(--line);margin-top:90px}
.numeros div{background:var(--paper);padding:56px 44px}
.numeros .n{font-family:var(--f-display);font-weight:700;font-size:104px;
            letter-spacing:-.02em;color:var(--orange);line-height:1}
.numeros .l{font-family:var(--f-body);font-size:16px;color:var(--body);margin-top:18px;
            line-height:1.4}
</style></head><body>

<div class="panel" id="panel">
  <div class="ctx">
    <div class="eyebrow">El proyecto</div>
    <h2 class="tt">Renueva Smart rediseña webs.<br><span class="it" style="color:var(--orange)">La suya no existía.</span></h2>
    <div class="sub">Sistema de contenido para Instagram, desde cero.</div>

    <div class="numeros">
      <div><div class="n">3</div><div class="l">Carruseles fijados</div></div>
      <div><div class="n">19</div><div class="l">Posteos planificados</div></div>
      <div><div class="n">7</div><div class="l">Destacados</div></div>
      <div><div class="n">2</div><div class="l">Tipografías propias</div></div>
    </div>
  </div>
  <div class="pie">
    <span class="firma">Renueva Smart — Sistema de contenido</span>
    <span class="num">02 / 08</span>
  </div>
</div>

</body></html>
