<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>Renueva Smart — Behance cierre</title>
<link rel="stylesheet" href="../renueva-fonts.css">
<link rel="stylesheet" href="_behance-base.css">
<style>
.cierre{height:820px;display:flex;flex-direction:column;justify-content:center;
        align-items:center;text-align:center}
.cierre .eyebrow{color:rgba(255,255,255,.7)}
.cierre h2{font-size:118px;color:#fff;margin-top:30px}
.cierre .ig{margin-top:36px;font-family:var(--f-body);font-weight:700;font-size:24px;
           color:#fff;letter-spacing:.01em}
.herr{position:absolute;left:var(--safe);bottom:56px;display:flex;gap:34px;
     font-family:var(--f-body);font-size:13px;letter-spacing:.1em;text-transform:uppercase;
     color:rgba(255,255,255,.62)}
.cred{position:absolute;right:var(--safe);bottom:56px;text-align:right;
     font-family:var(--f-body);color:rgba(255,255,255,.85)}
.cred .n{font-weight:700;font-size:16px}
.cred .r{font-size:13px;color:rgba(255,255,255,.6);margin-top:3px}
</style></head><body>

<div class="panel orange" id="panel" style="background:var(--ink)">
  <div class="cierre">
    <div class="eyebrow">Gracias por leer</div>
    <h2 class="tt">Renueva<span class="it" style="color:var(--orange)">.</span></h2>
    <div class="ig">@renuevasmart</div>
  </div>

  <div class="herr">
    <span>HTML &amp; CSS</span><span>Python</span><span>Playwright</span><span>Fraunces &amp; Plus Jakarta Sans</span>
  </div>
  <div class="cred">
    <div class="n">TU NOMBRE</div>
    <div class="r">Diseño y dirección de arte — 2026</div>
  </div>
</div>

</body></html>
