<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>Renueva Smart — Behance fijados</title>
<link rel="stylesheet" href="../renueva-fonts.css">
<link rel="stylesheet" href="_behance-base.css">
<style>
.fj{padding:150px var(--safe) 140px}
.fj .cab h2{font-size:74px;max-width:780px}
.fj .cab .sub{margin-top:22px;font-family:var(--f-body);font-size:22px;line-height:1.5;
             color:var(--body);max-width:640px}
.fila{display:flex;gap:44px;margin-top:78px}
.fila > div{flex:1}
.tarjeta{border-radius:6px;overflow:hidden;box-shadow:0 40px 90px rgba(11,12,14,.16);
         aspect-ratio:4/5}
.tarjeta img{width:100%;height:100%;object-fit:cover;display:block}
.cap{margin-top:26px}
.cap .fn{font-family:var(--f-body);font-weight:700;font-size:13px;letter-spacing:.16em;
        text-transform:uppercase;color:var(--orange)}
.cap h3{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.014em;
       margin-top:10px}
.cap .n{font-family:var(--f-body);font-size:15px;color:var(--grey);margin-top:8px}
</style></head><body>

<div class="panel" id="panel">
  <div class="fj">
    <div class="cab">
      <div class="eyebrow">Piezas fijadas</div>
      <h2 class="tt" style="margin-top:26px">Tres carruseles,<br>diseñados como serie.</h2>
    </div>

    <div class="fila">
      <div>
        <div class="tarjeta"><img src="../../FIJADO-1/RS-F1-01.png"></div>
        <div class="cap">
          <div class="fn">01 — Captar</div>
          <h3>¿Tu web necesita una renovación?</h3>
          <div class="n">10 slides</div>
        </div>
      </div>
      <div>
        <div class="tarjeta"><img src="../../FIJADO-2/RS-F2-01.png"></div>
        <div class="cap">
          <div class="fn">02 — Explicar</div>
          <h3>Qué hacemos en Renueva Smart</h3>
          <div class="n">11 slides</div>
        </div>
      </div>
      <div>
        <div class="tarjeta"><img src="../../FIJADO-3/RS-F3-01.png"></div>
        <div class="cap">
          <div class="fn">03 — Demostrar</div>
          <h3>Así transformamos una web</h3>
          <div class="n">8 slides</div>
        </div>
      </div>
    </div>
  </div>
  <div class="pie">
    <span class="firma">Renueva Smart — Sistema de contenido</span>
    <span class="num">04 / 08</span>
  </div>
</div>

</body></html>
